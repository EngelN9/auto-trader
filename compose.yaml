name: auto-trader-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_not_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

  mock-broker:
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
    command:
      - uvicorn
      - trading_system.brokers.mock.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      TRADING_CONFIG: configs/research.yaml
      MARKET_PROFILE: configs/markets/crypto_spot.yaml
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:8001:8001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  control-api:
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
    command:
      - uvicorn
      - trading_system.control.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      TRADING_CONFIG: configs/research.yaml
      MARKET_PROFILE: configs/markets/crypto_spot.yaml
      DATABASE_URL: postgresql://trader:local_dev_only_not_secret@postgres:5432/trading
      MOCK_BROKER_URL: http://mock-broker:8001
    depends_on:
      postgres:
        condition: service_healthy
      mock-broker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  trading-runtime:
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
    command:
      - python
      - -m
      - trading_system.engine.runtime
    environment:
      TRADING_CONFIG: configs/research.yaml
      MARKET_PROFILE: configs/markets/crypto_spot.yaml
      DATABASE_URL: postgresql://trader:local_dev_only_not_secret@postgres:5432/trading
      MOCK_BROKER_URL: http://mock-broker:8001
    depends_on:
      postgres:
        condition: service_healthy
      mock-broker:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard-web/Dockerfile
    environment:
      NEXT_PUBLIC_CONTROL_API_URL: http://localhost:8000
    depends_on:
      control-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
