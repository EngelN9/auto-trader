[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "auto-trader-platform"
version = "0.1.0"
description = "Fail-closed event-driven trading platform skeleton"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "EngelN9" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.135,<7",
  "mypy>=1.17,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7",
]
security = [
  "pip-audit>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_system"]

[tool.uv]
# Dependency updates must be at least seven days old when this lock was created.
exclude-newer = "2026-07-19T00:00:00Z"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "ASYNC", "S", "DTZ", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "property: property-based invariants",
  "integration: service-boundary integration checks",
  "contract: API and event contract checks",
  "e2e: local end-to-end skeleton checks",
  "replay: deterministic replay fixtures",
  "chaos: fail-closed fault injection checks",
]
